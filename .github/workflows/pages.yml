name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Smoke test offline HTML in a real browser
        run: python scripts/browser-smoke.py
      - uses: actions/configure-pages@v5
      - name: Bundle shared Mightora footer
        uses: mightora/shared-ui/.github/actions/sync-footer@main
        with:
          output-directory: dist
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public custom-domain response
        continue-on-error: true
        run: |
          echo 'Checking HTTPS and deployed app title at dax.mightora.io'
          curl --location --fail --silent --show-error --max-time 25 https://dax.mightora.io/ | grep -q 'DAX Workbench'

